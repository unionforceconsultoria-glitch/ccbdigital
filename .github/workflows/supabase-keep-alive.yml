name: Supabase Keep Alive

on:
  schedule:
    # Runs at 10:00 UTC every day (07:00 Brasilia Time)
    - cron: '0 10 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: "https://plpwbrwvxnqbxqdtmgqw.supabase.co"
          SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBscHdicnd2eG5xYnhxZHRtZ3F3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwNDc4OTEsImV4cCI6MjA4OTYyMzg5MX0.JCrL2XubaHDu1PFJJQN5e2Mmj6cyTzbtX4HxZjamq5U"
        run: |
          echo "Pinging Supabase at $SUPABASE_URL..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/documentos_admin?limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 500 ]; then
            echo "Successfully reached Supabase! Status code: $RESPONSE"
          else
            echo "Failed to reach Supabase API. Status code: $RESPONSE"
            exit 1
          fi
