name: Supabase Keep Alive

on:
  schedule:
    # Runs at 10:00 UTC every day (07:00 Brasilia Time)
    - cron: '0 10 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: "https://plpwbrwvxnqbxqdtmgqw.supabase.co"
          SUPABASE_ANON_KEY: "sb_publishable_ihGul-9h1wunK7mmQLYoFg_kmFdpGoE"
        run: |
          echo "Pinging Supabase at $SUPABASE_URL..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          
          if [ "$RESPONSE" -eq 200 ]; then
            echo "Successfully pinged Supabase API! Status code: 200"
          else
            echo "Failed to ping Supabase API. Status code: $RESPONSE"
            exit 1
          fi
